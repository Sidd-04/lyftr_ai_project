services:
  - type: web
    name: lyftr-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_MODEL
        value: "gemini/gemini-2.5-flash"
      - key: DATABASE_URL
        value: "sqlite:///data/app.db"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_API_KEYS
        sync: false
